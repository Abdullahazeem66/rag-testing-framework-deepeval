[pytest]
pythonpath = .
testpaths = tests
markers =
    component: retriever or generator tested in isolation
    e2e: full pipeline, rewrite -> retrieve -> generate
    deterministic: no LLM judge, fast and free
    judged: scored by the LLM judge, costs tokens
    slow: simulated conversations, long running
    smoke: small representative subset for quick checks
    synthetic: cases generated by the DeepEval Synthesizer
